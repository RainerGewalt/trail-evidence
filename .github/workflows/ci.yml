name: ci

# L1-L3 and the browser page (L4) on every pull request; docs/TESTING.md maps
# each job to its layer. Every job runs a target of the Makefile.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum
      - run: go -C go build ./...
      - run: make test-go

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: make test-python PYTHON=python

  python-package:
    name: Python package (sdist and wheel, no upload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build python
      - name: installed console script verifies the examples
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install python/dist/*.whl
          "$RUNNER_TEMP/venv/bin/trail-evidence-py" verify examples/transfer-worker.jsonl
          "$RUNNER_TEMP/venv/bin/trail-evidence-py" verify testdata/streams/signed.jsonl --pubkey testdata/keys/test-ed25519.pub --require-signatures
      - name: installed package carries the profile registry
        run: |
          "$RUNNER_TEMP/venv/bin/trail-evidence-py" profiles | grep -qx 'example.measurement/1'
          "$RUNNER_TEMP/venv/bin/trail-evidence-py" verify profiles/example.measurement/1.journal.jsonl --require-known-profiles

  web:
    name: JavaScript verifier web/verify.js (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: make test-js

  browser:
    name: Browser page in headless Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # google-chrome is preinstalled on the GitHub-hosted Ubuntu runners.
      - run: make test-web

  crosscheck:
    name: Go vs Python vs JavaScript crosscheck
    runs-on: ubuntu-latest
    needs: [go, python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make test-conformance PYTHON=python

  tooling:
    name: Tooling (schema, registry, generated files, formatting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # With jsonschema installed, validate_schema.py, profiles.py and
      # reason_codes.py also run a full JSON Schema validator.
      - run: pip install "jsonschema>=4.18" check-jsonschema
      - run: make test-tooling test-schema PYTHON=python
