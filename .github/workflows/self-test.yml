name: self-test

# Runs the composite action in action.yml from the checkout (uses: ./) against
# the example journals and the stream fixtures, and checks its outputs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action:
    name: action.yml on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: examples verify
        id: examples
        uses: ./
        with:
          journal: examples/*.jsonl

      - name: outputs of a passing run
        shell: bash
        env:
          VERDICT: ${{ steps.examples.outputs.verdict }}
          RECORDS: ${{ steps.examples.outputs.records }}
          ERRORS: ${{ steps.examples.outputs.errors }}
        run: |
          set -euo pipefail
          test "$VERDICT" = valid
          test "$RECORDS" = 14
          test "$ERRORS" = 0

      - name: signed fixture with required signatures
        id: signed
        uses: ./
        with:
          journal: testdata/streams/signed.jsonl
          pubkey: testdata/keys/test-ed25519.pub
          require-signatures: "true"

      - name: broken fixtures fail
        id: broken
        uses: ./
        continue-on-error: true
        with:
          journal: testdata/streams/seq-mismatch.jsonl testdata/streams/chain-break.jsonl

      - name: outputs of a failing run
        shell: bash
        env:
          OUTCOME: ${{ steps.broken.outcome }}
          VERDICT: ${{ steps.broken.outputs.verdict }}
          RECORDS: ${{ steps.broken.outputs.records }}
          ERRORS: ${{ steps.broken.outputs.errors }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          test "$VERDICT" = invalid
          test "$RECORDS" = 6
          test "$ERRORS" = 2

      - name: a gap makes the journal incomplete, which fails by default
        id: gap
        uses: ./
        continue-on-error: true
        with:
          journal: testdata/streams/seq-gap.jsonl

      - name: and passes with allow-incomplete
        id: gap-allowed
        uses: ./
        with:
          journal: testdata/streams/seq-gap.jsonl
          allow-incomplete: "true"

      - shell: bash
        env:
          OUTCOME: ${{ steps.gap.outcome }}
          VERDICT: ${{ steps.gap.outputs.verdict }}
          ERRORS: ${{ steps.gap.outputs.errors }}
          ALLOWED_VERDICT: ${{ steps.gap-allowed.outputs.verdict }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          test "$VERDICT" = incomplete
          test "$ERRORS" = 0
          test "$ALLOWED_VERDICT" = incomplete

      - name: an unknown profile does not change the verdict
        id: profiles
        uses: ./
        with:
          journal: testdata/streams/profile-unknown.jsonl

      - name: unless require-known-profiles is set
        id: profiles-required
        uses: ./
        continue-on-error: true
        with:
          journal: testdata/streams/profile-unknown.jsonl
          require-known-profiles: "true"
          allow-incomplete: "true"

      - shell: bash
        env:
          VERDICT: ${{ steps.profiles.outputs.verdict }}
          OUTCOME: ${{ steps.profiles-required.outcome }}
          REQUIRED_VERDICT: ${{ steps.profiles-required.outputs.verdict }}
        run: |
          set -euo pipefail
          test "$VERDICT" = valid
          test "$OUTCOME" = failure
          test "$REQUIRED_VERDICT" = incomplete

      - name: a journal without a record fails, also with allow-incomplete
        id: empty
        uses: ./
        continue-on-error: true
        with:
          journal: testdata/streams/empty.jsonl
          allow-incomplete: "true"

      - name: a directory is not a journal and gets no verdict
        id: directory
        uses: ./
        continue-on-error: true
        with:
          journal: testdata/keys

      - shell: bash
        env:
          EMPTY_OUTCOME: ${{ steps.empty.outcome }}
          EMPTY_VERDICT: ${{ steps.empty.outputs.verdict }}
          EMPTY_RECORDS: ${{ steps.empty.outputs.records }}
          DIR_OUTCOME: ${{ steps.directory.outcome }}
          DIR_VERDICT: ${{ steps.directory.outputs.verdict }}
        run: |
          set -euo pipefail
          test "$EMPTY_OUTCOME" = failure
          test "$EMPTY_VERDICT" = incomplete
          test "$EMPTY_RECORDS" = 0
          test "$DIR_OUTCOME" = failure
          test -z "$DIR_VERDICT"

      - name: unsigned journal with required signatures fails
        id: unsigned
        uses: ./
        continue-on-error: true
        with:
          journal: examples/transfer-worker.jsonl
          pubkey: testdata/keys/test-ed25519.pub
          require-signatures: "true"

      - shell: bash
        env:
          OUTCOME: ${{ steps.unsigned.outcome }}
          ERRORS: ${{ steps.unsigned.outputs.errors }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          test "$ERRORS" = 4
