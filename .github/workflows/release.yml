name: release

# Builds the trail-evidence binaries with GoReleaser when a tag v* is pushed,
# attaches them to the GitHub release with the CHANGELOG.md section of the tag
# as release notes, pushes the Go module tag go/<tag> so that
# `go install .../go/cmd/trail-evidence@<tag>` resolves, builds the Python
# distribution as a workflow artifact and uploads it to PyPI through trusted
# publishing (OIDC, no token; set up on pypi.org, docs/RELEASING.md). A failed
# PyPI upload fails the run; the GitHub release and the binaries exist by
# then.

on:
  push:
    tags:
      - "v*"

# Read only by default; the two jobs that create the release and push the
# module tag get contents: write, the PyPI job id-token: write.
permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - run: go test ./...
      - name: generated files are up to date
        run: go run ./internal/gentestdata -root .. -check

  goreleaser:
    name: GoReleaser
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - name: release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release-notes.sh "${TAG#v}" > "$RUNNER_TEMP/release-notes.md"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-module-tag:
    # The Go module lives in go/, so the module proxy looks for tags named
    # go/<version>. Push that tag alongside v<version> when it is missing.
    name: Go module tag go/${{ github.ref_name }}
    needs: [goreleaser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: push go/${{ github.ref_name }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/go/$TAG" >/dev/null 2>&1; then
            echo "go/$TAG already exists"
            exit 0
          fi
          git tag "go/$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/go/$TAG"

  python-dist:
    name: Python distribution (no upload)
    needs: [test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tag matches pyproject.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["TAG"]
          if tag != "v" + version:
              sys.exit(f"tag {tag} does not match pyproject.toml version {version}")
          print(f"tag {tag} matches pyproject.toml version {version}")
          PY
      - run: python -m pip install --upgrade build
      - run: python -m unittest discover -s tests
      - run: python -m build
      - name: installed console script verifies the example journal
        run: |
          python -m pip install dist/*.whl
          trail-evidence-py verify ../examples/transfer-worker.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ github.ref_name }}
          path: python/dist/
          if-no-files-found: error

  pypi:
    # Trusted publishing: PyPI accepts the upload because this workflow
    # (release.yml) in this repository, running in the environment "pypi",
    # presents a GitHub OIDC token. Set up once on pypi.org as a "pending
    # publisher" for the project trail-evidence (docs/RELEASING.md; set up on
    # 2026-11-03, first upload 0.2.0). A failed upload fails this job, so a
    # green release always means the package is on PyPI.
    name: Publish to PyPI (trusted publishing)
    needs: [python-dist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/trail-evidence/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist-${{ github.ref_name }}
          path: dist/
      - name: Upload to PyPI
        id: upload
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: Report the result
        if: always()
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$OUTCOME" = success ]; then
            echo "Uploaded trail-evidence ${TAG#v} to PyPI."
            echo "PyPI: uploaded trail-evidence ${TAG#v} (https://pypi.org/project/trail-evidence/${TAG#v}/)" >> "$GITHUB_STEP_SUMMARY"
          else
            msg="PyPI upload of trail-evidence ${TAG#v} failed (outcome: $OUTCOME). The GitHub release, the binaries and the Go module tag are not affected. If trusted publishing is not set up yet, register a pending publisher on pypi.org (project trail-evidence, owner RainerGewalt, repository trail-evidence, workflow release.yml, environment pypi) and re-run this job, or upload the artifact python-dist-${TAG} by hand; both are described in docs/RELEASING.md."
            echo "::warning title=PyPI upload skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
