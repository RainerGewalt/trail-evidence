name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "stable"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: generated files are up to date
        run: go run ./internal/gentestdata -root .. -check

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m trail_evidence verify ../examples/transfer-worker.jsonl
      - run: python -m trail_evidence verify ../testdata/streams/signed.jsonl --pubkey ../testdata/keys/test-ed25519.pub --require-signatures

  python-package:
    name: Python package (sdist and wheel, no upload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build python
      - name: installed console script verifies the examples
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install python/dist/*.whl
          "$RUNNER_TEMP/venv/bin/trail-evidence-py" verify examples/transfer-worker.jsonl
          "$RUNNER_TEMP/venv/bin/trail-evidence-py" verify testdata/streams/signed.jsonl --pubkey testdata/keys/test-ed25519.pub --require-signatures

  web:
    name: Browser verifier (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node web/test/run.mjs
      - run: node web/test/run.mjs report examples/transfer-worker.jsonl
      - run: node web/test/run.mjs report testdata/streams/signed.jsonl --pubkey testdata/keys/test-ed25519.pub --require-signatures

  crosscheck:
    name: Go vs Python vs JavaScript crosscheck
    runs-on: ubuntu-latest
    needs: [go, python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: scripts/crosscheck.sh
        env:
          PYTHON: python

  schema:
    name: Schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.18" check-jsonschema
      - name: schema file is itself valid
        run: check-jsonschema --check-metaschema schema/trail-evidence-1.schema.json
      - name: examples, fixtures and vectors
        run: scripts/validate_schema.py --vectors testdata/vectors.json examples/*.jsonl testdata/streams/valid-chain.jsonl testdata/streams/restart.jsonl testdata/streams/signed.jsonl testdata/streams/multi-stream.jsonl
      - name: reason code catalog
        run: |
          check-jsonschema --check-metaschema schema/reason-codes.schema.json
          check-jsonschema --schemafile schema/reason-codes.schema.json schema/reason-codes.json
          python scripts/reason_codes.py --check
