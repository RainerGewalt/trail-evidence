# GoReleaser configuration. Run by .github/workflows/release.yml on tags v*.
# Local check: goreleaser check; local dry run: goreleaser release --snapshot --clean
version: 2

project_name: trail-evidence

before:
  hooks:
    - go -C go mod download

builds:
  - id: trail-evidence
    dir: go
    main: ./cmd/trail-evidence
    binary: trail-evidence
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids: [trail-evidence]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - SPEC.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# The release notes are the section of CHANGELOG.md for the tag: the release
# workflow extracts it and passes it with --release-notes, which replaces the
# generated changelog. (With disable: true GoReleaser would drop it as well.)
changelog:
  disable: false

release:
  github:
    owner: RainerGewalt
    name: trail-evidence
  prerelease: auto
  mode: keep-existing
  header: |
    Try it: `go install github.com/RainerGewalt/trail-evidence/go/cmd/trail-evidence@{{ .Tag }}`, then `trail-evidence verify journal.jsonl`; or drop a journal on https://rainergewalt.github.io/trail-evidence/ (nothing is uploaded).

    Binaries for Linux, macOS and Windows (amd64, arm64) are attached; each
    archive contains `LICENSE` and `SPEC.md`, and `checksums.txt` holds the
    SHA-256 of every archive. Python: `pip install trail-evidence=={{ .Version }}`
    (uploaded to PyPI by the same release workflow through trusted
    publishing). GitHub Action: `RainerGewalt/trail-evidence@{{ .Tag }}`.

    Changes in {{ .Version }}, from [CHANGELOG.md](https://github.com/RainerGewalt/trail-evidence/blob/{{ .Tag }}/CHANGELOG.md):

snapshot:
  version_template: "{{ incpatch .Version }}-next"
